[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "railfine"
version = "0.1.0"
description = "RailFine Analytics - carte ferroviaire France/Belgique et analyse locale de vos amendes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "shapely>=2.0",
    "mapbox-vector-tile>=2.1",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
railfine = "railfine.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
